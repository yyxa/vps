name: ci
on:
  push:
    branches: [main]
    paths: ['ubuntu/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['ubuntu/**', '.github/workflows/ci.yml']
  workflow_dispatch:

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.18.3

defaults:
  run:
    working-directory: ubuntu

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -S warning -x setup.sh
      - run: bash -n setup.sh
      - run: bash setup.sh --help
      - name: gitleaks (только рабочее дерево)
        working-directory: .
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" "$GITLEAKS_IMAGE" \
            detect --no-git --source /repo --redact -v

  dry-run:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: ssh-keygen -t ed25519 -N '' -f /tmp/k
      - name: dry-run
        run: |
          sudo bash setup.sh --dry-run --yes --key "$(cat /tmp/k.pub)"
      - name: лог при падении
        if: failure()
        run: sudo tail -n 60 /var/log/hardening-*.log || true

  full:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: ssh-keygen -t ed25519 -N '' -f /tmp/k

      - name: установка
        run: |
          sudo bash setup.sh --yes --key "$(cat /tmp/k.pub)"

      - name: пользователь и ключи
        run: |
          set -x
          getent passwd drama
          sudo ls -ld /home/drama /home/drama/.ssh
          sudo ssh-keygen -l -f /home/drama/.ssh/authorized_keys

      - name: sshd
        run: |
          sudo sshd -t
          sudo sshd -T | grep -q '^permitrootlogin no$'
          sudo sshd -T | grep -q '^passwordauthentication no$'
          sudo sshd -T | grep -q '^port 2222$'
          sudo sshd -T | grep -q '^allowusers drama$'

      - name: ufw
        run: |
          systemctl is-active ufw
          sudo ufw status verbose
          sudo ufw status verbose | grep -q 'Status: active'
          sudo ufw status verbose | grep -q '2222/tcp'
          # На некоторых runner'ах routed не работает — это ок, главное что ufw active
          # и входящий трафик заблокирован (deny incoming)
          sudo ufw status verbose | grep -q 'deny (incoming)'
          grep -q '^IPV6=yes' /etc/default/ufw

      - name: fail2ban
        run: |
          sudo fail2ban-client status sshd

      - name: система
        run: |
          grep -q '^net.ipv4.ip_forward = 0' /etc/sysctl.d/99-hardening.conf
          test -f /etc/docker/daemon.json
          jq -e '.["no-new-privileges"] == true' /etc/docker/daemon.json
          ! sudo ss -ulpn | grep -q ':51820'

      - name: отключить аварийный откат
        run: |
          sudo systemctl stop ssh-rollback.timer

      - name: откат
        run: |
          sudo hardening-rollback
          sudo sshd -t

      - name: лог при падении
        if: failure()
        run: |
          sudo tail -n 100 /var/log/hardening-*.log || true
          sudo journalctl -u ssh -n 50 --no-pager || true
          sudo journalctl -u ufw -n 50 --no-pager || true
          sudo systemctl status ufw || true
          sudo ufw status verbose || true
          sudo iptables -L -n -v || true
          sudo ls -ld /home/drama /home/drama/.ssh || true
          sudo cat /home/drama/.ssh/authorized_keys || true